<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gold & Indices Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="app-title">Markets Dashboard</h1>
      <div class="date-subtitle" id="update-time">--</div>
    </header>

    <main class="dashboard">
      <!-- Market Overview Cards -->
      <section class="overview-grid">
        
        <!-- Gold Card -->
        <a id="gold-link" href="https://quote.eastmoney.com/globalfuture/AU9999.html" target="_blank" class="glass-card gold-card">
          <div class="card-header">
            <span class="card-title">黄金 (AU9999)</span>
            <div id="gold-trend" class="trend-badge trend-flat">--</div>
          </div>
          <div class="card-body">
            <div id="gold-price" class="main-price">--</div>
          </div>
          <div class="card-bg-glow"></div>
        </a>

        <div class="sub-cards-row">
          <!-- Index Card -->
          <a id="index-link" href="https://quote.eastmoney.com/unify/r/1.000001" target="_blank" class="glass-card index-card">
            <div class="card-header">
              <span class="card-title">上证指数</span>
            </div>
            <div class="card-body">
              <div id="index-price" class="main-price small">--</div>
              <div id="index-trend" class="trend trend-flat">--</div>
            </div>
          </a>

          <!-- Earnings Card -->
          <div class="glass-card earnings-card">
            <div class="card-header">
              <span class="card-title">今日预估盈亏</span>
            </div>
            <div class="card-body">
              <div id="earnings-value" class="main-price small">--</div>
              <div class="subtitle">持仓基金总和</div>
            </div>
          </div>
        </div>

      </section>

      <!-- Portfolio Section -->
      <section class="portfolio-section">
        <div class="section-header">
          <h2>Your Portfolio</h2>
          <button id="add-fund-btn" class="icon-btn-add" aria-label="Add Fund">+</button>
        </div>
        
        <div id="funds-list" class="funds-list">
          <!-- Rendered by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Add Fund Bottom Sheet -->
  <dialog id="add-fund-dialog" class="bottom-sheet">
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <h3 class="dialog-title">添加基金</h3>
      <div class="form-group">
        <label>基金代码</label>
        <input type="text" id="add-code" placeholder="输入 6 位代码" maxlength="6" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>初始持仓 (元)</label>
        <input type="number" id="add-amount" placeholder="0.00" inputmode="decimal">
      </div>
      <div id="add-error" class="error-msg"></div>
      <div class="dialog-actions">
        <button class="btn-text" id="add-cancel-btn">取消</button>
        <button class="btn-primary" id="add-submit-btn">添加至持仓</button>
      </div>
    </div>
  </dialog>

  <!-- Adjust Fund Bottom Sheet -->
  <dialog id="adjust-fund-dialog" class="bottom-sheet">
    <div class="sheet-content">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h3 class="dialog-title" id="adjust-fund-name">--</h3>
        <button class="btn-icon-close" id="adjust-cancel-btn">✕</button>
      </div>
      <div class="fund-summary-box">
        <span>当前持仓成本</span>
        <span class="value" id="adjust-fund-cost">--</span>
      </div>
      
      <div class="form-group">
        <label>调整金额 (元)</label>
        <input type="number" id="adjust-amount" placeholder="输入变动金额" inputmode="decimal">
      </div>
      <div id="adjust-error" class="error-msg"></div>
      
      <div class="action-grid">
        <button class="btn-action decrease" id="adjust-decrease-btn">买出减仓</button>
        <button class="btn-action increase" id="adjust-increase-btn">买入加仓</button>
      </div>
      
      <button class="btn-danger-outline" id="adjust-delete-btn">删除此基金</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
